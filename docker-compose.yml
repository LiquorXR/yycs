name: zhenfan

services:
  # 一次性构建：容器运行时执行 npm run build，产物经命名卷 frontend_dist 交由 backend 托管
  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    command: ["npm", "run", "build"]
    volumes:
      - frontend_dist:/app/dist
    restart: "no"

  # 一次性迁移+种子：prod 不走 dev 自动建表/种子，由 init_prod.py 完成
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "scripts/init_prod.py"]
    env_file: .env
    volumes:
      - app_data:/data
    restart: "no"

  # 后端 API + 前端静态托管：仅映射回环地址，由主机 nginx 统一反代到 127.0.0.1:8000
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - app_data:/data
      - frontend_dist:/app/dist:ro
      # 微信支付商户私钥/平台证书（WXPAY_PRIVATE_KEY_PATH / WXPAY_PLATFORM_CERT_PATH）
      - ./certs:/app/certs:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      frontend-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app_data:
  frontend_dist:

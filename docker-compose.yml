name: zhenfan

services:
  # 一次性构建：容器运行时执行 npm run build，产物经命名卷 frontend_dist 交由 backend 托管
  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    command: ["npm", "run", "build"]
    # 2C1G 机器构建 Vite 易 OOM：限制 Node 堆上限，配合宿主机 swap 兜底
    environment:
      NODE_OPTIONS: "--max-old-space-size=512"
    volumes:
      - frontend_dist:/app/dist
    restart: "no"

  # 一次性迁移+种子：prod 不走 dev 自动建表/种子，由 init_prod.py 完成
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "scripts/init_prod.py"]
    env_file: .env
    volumes:
      - app_data:/data
    restart: "no"

  # 后端 API + 前端静态托管：仅映射回环地址，由主机 nginx/NPM 统一反代到 <host-IP>:8000
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # 2 worker 吃满双核读吞吐；SQLite 写仍串行（WAL+busy_timeout 由 session.py PRAGMA 兜底），
    # 对账后台任务经 reconcile.lock 文件锁保证仅单 worker 运行
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--log-level", "warning"]
    # 2C1G 内存护栏：容器超限由内核回收（配合宿主机 swap 2GB）
    mem_limit: 700m
    env_file: .env
    volumes:
      - app_data:/data
      - frontend_dist:/app/dist:ro
      # 收钱吧公钥 PEM（SQB_PUBLIC_KEY_PATH=/app/certs/shouqianba_pub.pem，只读挂载；
      # 确认 backend 运行用户对 certs/ 有读权限，否则回调验签恒 fail）
      - ./certs:/app/certs:ro
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      frontend-build:
        condition: service_completed_successfully
    # 日志轮转：防 2C1G 磁盘被 json-file 日志写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app_data:
  frontend_dist:

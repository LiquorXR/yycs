name: zhenfan

services:
  # 一次性构建：前端产物落到宿主 ./dist，由主机 nginx 托管（TLS/反代在项目外配置）
  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - ./dist:/app/dist
    restart: "no"

  # 一次性迁移：建表（alembic upgrade head）+ 幂等种子商品（prod 不走 dev 自动建表/种子）
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: >
      sh -c "alembic upgrade head &&
             python -c \"
               from app.db.session import SessionLocal
               from app.services.seed import seed_products
               db = SessionLocal()
               seed_products(db)
               db.close()
             \""
    env_file: .env
    volumes:
      - app_data:/data
    restart: "no"

  # 后端 API：仅映射回环地址，由主机 nginx 反代 /api 与 /static
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app_data:
